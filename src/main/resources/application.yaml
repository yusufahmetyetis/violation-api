spring:
  application:
    name: jwt-demo

  datasource:
    # PostgreSQL docker-compose.yml ile çalışır: önce `docker compose up -d`.
    # ${DEGISKEN:varsayilan} → ortam değişkeni varsa onu, yoksa yerel geliştirme değerini kullan.
    # DEMO İÇİN: gerçek ortamda DB_PASSWORD mutlaka ortam değişkeninden / secret yöneticisinden gelir.
    # Port 5433: docker-compose.yml container'ın 5432'sini host'ta 5433'e açıyor.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:jwtdemo}
    username: ${DB_USER:jwtdemo}
    password: ${DB_PASSWORD:jwtdemo}

  flyway:
    # Tabloları ve demo verileri src/main/resources/db/migration altındaki V1__, V2__... kurar.
    # Her dosya bir kez çalışır; hangilerinin çalıştığı DB'deki flyway_schema_history tablosunda tutulur.
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate  # Tabloları Flyway kurar; Hibernate sadece entity'ler tabloya uyuyor mu diye kontrol eder
    show-sql: true        # Çalışan SQL'leri logda görelim
    open-in-view: false

  sql:
    init:
      mode: never         # schema.sql / data.sql mekanizması kapalı, bu işi artık Flyway yapıyor

springdoc:
  # Swagger UI:   http://localhost:8080/swagger-ui.html
  # Sözleşme:     http://localhost:8080/v3/api-docs  (YAML için /v3/api-docs.yaml)
  # GERÇEK ORTAMDA: ya kapatılır (springdoc.api-docs.enabled=false, springdoc.swagger-ui.enabled=false)
  # ya da SecurityConfig'te permitAll yerine yetkiye bağlanır. API haritası saldırgana da harita olur.
  override-with-generic-response: false   # @RestControllerAdvice'taki 400'ü HER endpoint'e ekleme
  default-produces-media-type: application/json   # cevaplar Swagger'da */* değil application/json görünsün
  swagger-ui:
    persist-authorization: true   # sayfa yenilenince Authorize'daki token silinmesin
    display-request-duration: true

jwt:
  # DEMO İÇİN: Gerçek projede secret asla koda veya yaml'a yazılmaz,
  # ortam değişkeni ya da bir secret yöneticisinden (Vault vb.) okunur.
  # HS256 en az 32 byte (256 bit) anahtar ister.
  secret: "bu-anahtar-sadece-demo-icindir-intetra-jwt-2026"
  expiration-seconds: 900   # 15 dk. Senaryo 7'de 30 yapacağız.

