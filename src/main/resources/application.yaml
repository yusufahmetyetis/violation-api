spring:
  application:
    name: jwt-demo

  datasource:
    # mem = RAM'de. DB_CLOSE_DELAY=-1: bağlantı kapansa da DB uygulama yaşadıkça yaşasın
    url: jdbc:h2:mem:jwtdemo;DB_CLOSE_DELAY=-1
    username: sa
    password:

  h2:
    console:
      # SADECE YEREL GELİŞTİRME İÇİN. Gerçek projede/sunucuda asla açık olmamalı:
      # konsola erişen biri tüm veritabanını okuyup değiştirebilir.
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: none      # Tabloları Hibernate değil, biz schema.sql ile kuracağız
    show-sql: true        # Çalışan SQL'leri logda görelim
    open-in-view: false

  sql:
    init:
      mode: always        # schema.sql / data.sql her açılışta çalışsın (2. aşamada eklenecek)

springdoc:
  # Swagger UI:   http://localhost:8080/swagger-ui.html
  # Sözleşme:     http://localhost:8080/v3/api-docs  (YAML için /v3/api-docs.yaml)
  # GERÇEK ORTAMDA: ya kapatılır (springdoc.api-docs.enabled=false, springdoc.swagger-ui.enabled=false)
  # ya da SecurityConfig'te permitAll yerine yetkiye bağlanır. API haritası saldırgana da harita olur.
  override-with-generic-response: false   # @RestControllerAdvice'taki 400'ü HER endpoint'e ekleme
  default-produces-media-type: application/json   # cevaplar Swagger'da */* değil application/json görünsün
  swagger-ui:
    persist-authorization: true   # sayfa yenilenince Authorize'daki token silinmesin
    display-request-duration: true

jwt:
  # DEMO İÇİN: Gerçek projede secret asla koda veya yaml'a yazılmaz,
  # ortam değişkeni ya da bir secret yöneticisinden (Vault vb.) okunur.
  # HS256 en az 32 byte (256 bit) anahtar ister.
  secret: "bu-anahtar-sadece-demo-icindir-intetra-jwt-2026"
  expiration-seconds: 900   # 15 dk. Senaryo 7'de 30 yapacağız.

