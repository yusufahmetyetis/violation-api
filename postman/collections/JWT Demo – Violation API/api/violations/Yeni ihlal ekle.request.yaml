        "plate": {
          "type": "string",
          "minLength": 0,
          "maxLength": 15,
          "example": "35C0001",
          "description": "Araç plakası"
        },
        "date": {
          "type": "string",
          "example": "2026-11-20",
          "description": "İhlal tarihi (ISO-8601, yyyy-MM-dd)",
          "format": "date"
        },
        "amount": {
          "type": "number",
          "example": 40,
          "description": "Ceza tutarı (TL, en fazla 2 ondalık)"
        }
      },
      "required": [
        "amount",
        "date",
        "plate"
      ]
