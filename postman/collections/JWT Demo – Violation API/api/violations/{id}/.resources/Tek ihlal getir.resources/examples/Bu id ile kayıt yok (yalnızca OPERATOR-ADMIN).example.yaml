$kind: http-example
name: Bu id ile kayıt yok (yalnızca OPERATOR/ADMIN)
request:
  url: "{{baseUrl}}/api/violations/:id"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: "1"
      disabled: false
      description: İhlal id
  body:
    type: text
    content: ""
response:
  statusCode: 404
  statusText: Not Found
  body:
    type: text
    content: ""
order: 4000
