$kind: http-example
request:
  url: "{{baseUrl}}/api/violations"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "amount": 40,
        "date": "2026-11-20",
        "plate": "35C0001"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    - key: Content-Type
      value: application/json
    - key: Location
      value: /api/violations/5
      disabled: false
      description: Yeni kaydın adresi
      $type: |-
        {
          "type": "object",
          "properties": {
            "value": {
              "type": "string",
              "example": "/api/violations/5"
            }
          }
        }
  body:
    type: json
    content: |-
      {
        "amount": 12.36,
        "date": "2026-11-11",
        "id": 1,
        "plate": "34A0261"
      }
    $type: |-
      {
        "description": "Trafik ihlali kaydı",
        "type": "object",
        "properties": {
          "plate": {
            "type": "string",
            "example": "34A0261",
            "description": "Araç plakası"
          },
          "date": {
            "type": "string",
            "example": "2026-11-11",
            "description": "İhlal tarihi (ISO-8601, yyyy-MM-dd)",
            "format": "date"
          },
          "amount": {
            "type": "number",
            "example": 12.36,
            "description": "Ceza tutarı (TL, 2 ondalık)"
          }
        },
        "required": [
          "amount",
          "date",
          "id",
          "plate"
        ]
      }
order: 1000
