# Her push'ta ve main'e açılan her PR'da derler ve testleri çalıştırır.
# Testcontainers GitHub'ın Ubuntu makinesindeki Docker'ı kullanır; ek ayar gerekmez.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Repo Windows'ta oluşturulduğu için mvnw'nin çalıştırma izni git'te kayıtlı olmayabilir
      - run: chmod +x mvnw

      - run: ./mvnw -B verify
